<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACH Simulator Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
    --accent: #2f5bd3; --sel: #eaf0ff;
    --post: #16794a; --post-bg: #e3f4ea; --ret: #b42318; --ret-bg: #fde8e6;
    --noc: #9a5b00; --noc-bg: #fdf0d9; --info: #475467; --info-bg: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a; --panel: #1a1f27; --text: #e6e9ef; --muted: #98a2b3; --line: #2b323d;
      --accent: #7ea2ff; --sel: #22304d;
      --post: #5fd39a; --post-bg: #173326; --ret: #ff8a7f; --ret-bg: #3d1d1b;
      --noc: #f4bd5c; --noc-bg: #3a2c12; --info: #b5bfcc; --info-bg: #262d38;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  header label { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { padding: 16px 20px; display: grid; gap: 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat.ret .v { color: var(--ret); } .stat.noc .v { color: var(--noc); } .stat.post .v { color: var(--post); }
  .cols { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(0, 2.2fr); gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .cols { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
              margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line);
              display: flex; align-items: center; gap: 8px; }
  .panel h2 .right { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .scroll { max-height: 520px; overflow: auto; }
  .file { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .file:hover { background: var(--bg); }
  .file.sel { background: var(--sel); }
  .file .top { display: flex; gap: 8px; align-items: center; }
  .file .id { font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
  .file .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .file .err { color: var(--ret); font-size: 12px; margin-top: 4px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
          font-weight: 600; white-space: nowrap; }
  .pill.post, .pill.accepted { color: var(--post); background: var(--post-bg); }
  .pill.return, .pill.rejected { color: var(--ret); background: var(--ret-bg); }
  .pill.noc { color: var(--noc); background: var(--noc-bg); }
  .pill.info { color: var(--info); background: var(--info-bg); }
  .grow { margin-left: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; background: var(--bg); position: sticky; top: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.mono, .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  td .pill { margin: 0 4px 2px 0; }
  .batch-h { padding: 10px 14px 6px; font-weight: 600; }
  .batch-h span { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .empty { padding: 24px 14px; color: var(--muted); text-align: center; }
  pre { margin: 0; padding: 12px 14px; font: 12px/1.4 ui-monospace, Menlo, monospace;
        overflow: auto; max-height: 420px; background: var(--bg); }
  .tabs { display: flex; gap: 4px; }
  .tabs button, .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text);
                       padding: 4px 10px; border-radius: 6px; font: inherit; font-size: 12px; cursor: pointer; }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  select { font: inherit; font-size: 12px; background: var(--panel); color: var(--text);
           border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  .boxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; padding: 12px; }
  .box { border: 1px solid var(--line); border-radius: 8px; }
  .box h3 { margin: 0; padding: 8px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
  .box h3 span { color: var(--muted); font-weight: 400; }
  .box ul { list-style: none; margin: 0; padding: 4px 0; }
  .box li { padding: 3px 12px; font: 12px ui-monospace, Menlo, monospace; cursor: pointer; }
  .box li:hover { background: var(--bg); }
  .box li.done { color: var(--muted); }
  .box .lbl { padding: 6px 12px 0; font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .ev-detail { color: var(--muted); font-size: 12px; }
  .pill.error { color: #fff; background: var(--ret); }
  .pill.ok { color: var(--post); background: var(--post-bg); }
  .muted { color: var(--muted); font-size: 12px; }
  .copy { cursor: copy; border-bottom: 1px dotted var(--muted); }
  .link { color: var(--accent); cursor: pointer; text-decoration: underline; }
  /* step-by-step view */
  .steps-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px;
               border-bottom: 1px solid var(--line); }
  .steps-grid { display: grid; grid-template-columns: minmax(300px, 2fr) minmax(0, 3fr); align-items: start; }
  @media (max-width: 1300px) { .steps-grid { grid-template-columns: 1fr; } }
  ol.stepper { list-style: none; margin: 0; padding: 8px 0; border-right: 1px solid var(--line);
               max-height: 560px; overflow: auto; }
  .step { display: grid; grid-template-columns: 28px minmax(0, 1fr) 70px; gap: 8px; align-items: center;
          padding: 6px 12px; cursor: pointer; position: relative; transition: opacity .25s; }
  .step:hover { background: var(--bg); }
  .step.sel { background: var(--sel); }
  .step.future { opacity: .3; }
  .step .num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
               font-size: 11px; font-weight: 700; color: #fff; background: var(--post); }
  .step.rejected .num, .step.error .num { background: var(--ret); }
  .step.skipped .num { background: var(--info); }
  .step:not(:last-child) .num::after { content: ""; position: absolute; left: 23px; top: 30px;
               height: calc(100% - 24px); border-left: 2px solid var(--line); }
  .step .t { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .svc { font: 11px ui-monospace, Menlo, monospace; color: var(--accent); }
  .step .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .dur { font: 11px ui-monospace, Menlo, monospace; text-align: right; color: var(--muted); }
  .step .bar { height: 4px; border-radius: 2px; background: var(--accent); margin-bottom: 3px; margin-left: auto; min-width: 2px; }
  .step-detail { padding: 12px 14px; display: grid; gap: 12px; }
  .step-detail h3 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .step-detail .desc { color: var(--muted); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font-size: 12px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .kv div:nth-child(even) { font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  .tele { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; }
  .tele .h { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .tele .row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; font-size: 12px; align-items: baseline; }
  .tele .row b { font-weight: 600; }
  .tele code, .dql { font: 11.5px ui-monospace, Menlo, monospace; }
  td.ts { white-space: nowrap; }
  tr.ev { cursor: pointer; }
  tr.ev:hover td { background: var(--bg); }
  tr.json td { background: var(--bg); padding: 0; }
  tr.json pre { max-height: 260px; }
  .sec-h { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>ACH Simulator</h1>
  <span class="meta" id="meta">connecting…</span>
  <label><input type="checkbox" id="live" checked> live refresh</label>
</header>
<main>
  <section class="stats" id="stats"></section>

  <section class="cols">
    <div class="panel">
      <h2>Submitted files <span class="right" id="file-count"></span></h2>
      <div class="scroll" id="files"></div>
    </div>
    <div class="panel">
      <h2><span id="detail-title">Details</span>
        <span class="right tabs" id="detail-tabs"></span></h2>
      <div id="detail"><div class="empty">Select a file to step through how it was processed, then view its entries and events.</div></div>
    </div>
  </section>

  <section class="panel">
    <h2>
      <span class="tabs"><button id="tab-events" class="on">Event log</button><button id="tab-mail">Mailboxes</button></span>
      <span class="right"><label class="muted" id="ev-only-l"><input type="checkbox" id="ev-only"> selected file only</label>
        <select id="ev-filter"><option value="">all events</option></select></span>
    </h2>
    <div id="bottom"></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (c) => (c / 100).toLocaleString("en-US", {style: "currency", currency: "USD"});
const simTime = (t) => t ? t.replace("T", " ").replace(/\.\d+/, "").replace(/:00([+-]\d\d:\d\d)$/, " $1") : "";

let state = null, selected = null, detailView = "steps", bottomTab = "events", lastSig = "";
let stepIdx = 0, playTimer = null, openEvents = new Set();

// What each processing step is, which service does it, and its span name.
const STEP_INFO = {
  receive: ["Receive file", "ach-operator", "Authenticate the sending bank by its API key and store the raw file."],
  validate: ["Validate (Nacha edits)", "ach-validation", "Record lengths, field formats, batch and file counts, entry hash and totals."],
  origin_check: ["Origin & destination", "ach-operator", "The file's immediate origin must be the authenticated bank and its destination the operator."],
  duplicate_check: ["Duplicate check", "ach-operator", "Origin + creation date/time + file ID modifier must not have been accepted before."],
  settle: ["Settlement", "ach-settlement", "Settlement date and Same Day window for each batch."],
  accept: ["Accept", "ach-operator", "The file is accepted; totals and settlement are recorded."],
  route: ["Route to RDFI", "ach-operator", "Entries for one receiving bank are bundled into a file and delivered to its mailbox."],
  operator_returns: ["Operator returns (R13)", "ach-operator", "Entries for banks outside the network are returned by the operator."],
  dispatch: ["RDFI processing", "ach-rdfi", "The receiving bank's service posts, returns or NOCs each entry, then sends its returns back as a file of its own."],
  mailbox_download: ["Mailbox download", "ach-operator", "The receiving bank's client downloads the file from its mailbox."],
  mailbox_ack: ["Mailbox acknowledged", "ach-operator", "The receiving bank confirms pickup; the file moves to picked_up/."],
};
const SPAN_NAME = {route: "ach.rdfi.route", dispatch: "ach.rdfi.dispatch"};
const STEP_KEYS = new Set(["ts", "event", "file_id", "step", "status", "duration_ms", "trace_id", "span_id", "events"]);
const bankName = (rt) => state?.mailboxes.find((m) => m.routing === rt)?.name || rt;
const statusPill = (s) => s === "ok" ? "ok" : s === "rejected" ? "return" : s === "error" ? "error" : "info";
function copy(text) { navigator.clipboard?.writeText(text); }

async function getJSON(url) {
  const r = await fetch(url, {cache: "no-store"});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function refresh() {
  try {
    state = await getJSON("/api/state");
  } catch (e) {
    $("#meta").textContent = "dashboard server unreachable";
    return;
  }
  const sig = state.events.length + ":" + (state.events[0]?.ts || "") + ":" + state.files.length;
  $("#meta").textContent = `watching ${state.data_dir} · updated ${new Date().toLocaleTimeString()}`;
  if (sig === lastSig) return;
  lastSig = sig;
  renderStats(); renderFiles(); renderBottom();
  if (selected?.type === "file") loadFile(selected.id, true);
}

function renderStats() {
  const s = state.stats;
  const tiles = [
    ["Files accepted", s.accepted], ["Files rejected", s.rejected, s.rejected ? "ret" : ""],
    ["Entries forwarded", s.forwarded], ["Posted", s.posted, "post"],
    ["Returns", s.returns, "ret"], ["NOCs", s.nocs, "noc"],
    ["Credits", money(s.credit_cents)], ["Debits", money(s.debit_cents)],
  ];
  $("#stats").innerHTML = tiles.map(([k, v, c]) =>
    `<div class="stat ${c || ""}"><div class="v">${esc(v)}</div><div class="k">${esc(k)}</div></div>`).join("");
}

function renderFiles() {
  $("#file-count").textContent = state.files.length ? `${state.files.length}` : "";
  if (!state.files.length) {
    $("#files").innerHTML = `<div class="empty">No files yet. Start the operator and send a file, or run <span class="mono">python3 run_demo.py</span>.</div>`;
    return;
  }
  $("#files").innerHTML = state.files.map((f) => {
    const sel = selected?.type === "file" && selected.id === f.file_id ? " sel" : "";
    let sub = `${esc(f.submitter)} · sim ${esc(simTime(f.sim_time))}`;
    let extra = "";
    if (f.status === "accepted") {
      const windows = [...new Set(f.batches.map((b) => b.window))].join(", ");
      sub += `<br>${f.entries} ${f.entries === 1 ? "entry" : "entries"} · Cr ${money(f.credit_cents)} · Dr ${money(f.debit_cents)} · ${esc(windows)}`;
      if (f.returns) extra += `<span class="pill return">${f.returns} return${f.returns > 1 ? "s" : ""}</span> `;
      if (f.nocs) extra += `<span class="pill noc">${f.nocs} NOC${f.nocs > 1 ? "s" : ""}</span> `;
      for (const w of f.warnings || []) sub += `<div class="err" style="color:var(--noc)">⚠ ${esc(w)}</div>`;
    } else {
      sub += (f.errors || []).map((e) => `<div class="err">${esc(e)}</div>`).join("");
    }
    return `<div class="file${sel}" data-id="${esc(f.file_id)}">
      <div class="top"><span class="id">${esc(f.file_id)}</span><span class="pill ${f.status}">${f.status}</span>
      <span class="grow">${extra}</span></div><div class="sub">${sub}</div></div>`;
  }).join("");
  document.querySelectorAll(".file").forEach((el) => el.onclick = () => {
    selectFile(el.dataset.id);
  });
}

function selectFile(id) {
  stopPlay();
  selected = {type: "file", id}; detailView = "steps"; stepIdx = 0; openEvents.clear();
  renderFiles(); loadFile(id);
  if ($("#ev-only").checked) renderBottom();
}

function setTabs(views) {
  $("#detail-tabs").innerHTML = views.map(([v, label]) =>
    `<button data-v="${v}" class="${v === detailView ? "on" : ""}">${label}</button>`).join("");
  document.querySelectorAll("#detail-tabs button").forEach((b) => b.onclick = () => {
    if (b.dataset.v !== "steps") stopPlay();
    detailView = b.dataset.v; renderDetail();
  });
}

let detail = null;
async function loadFile(id, quiet) {
  try { detail = {type: "file", data: await getJSON(`/api/file/${encodeURIComponent(id)}`)}; }
  catch { if (!quiet) $("#detail").innerHTML = `<div class="empty">Could not load ${esc(id)}.</div>`; return; }
  renderDetail();
  if ($("#ev-only").checked && bottomTab === "events") renderBottom();
}
async function loadMailbox(rt, name, picked) {
  selected = {type: "mail"}; detailView = "describe"; renderFiles();
  try { detail = {type: "mail", rt, data: await getJSON(`/api/mailbox/${rt}/${encodeURIComponent(name)}${picked ? "?picked_up=1" : ""}`)}; }
  catch { $("#detail").innerHTML = `<div class="empty">Could not load ${esc(name)}.</div>`; return; }
  renderDetail();
}

function renderDetail() {
  if (!detail) return;
  const d = detail.data;
  if (detail.type === "mail") {
    $("#detail-title").textContent = d.name;
    setTabs([["describe", "Decoded"], ["raw", "Raw"]]);
    $("#detail").innerHTML = `<pre>${esc(detailView === "raw" ? d.raw : d.describe)}</pre>`;
    return;
  }
  $("#detail-title").textContent = d.file_id;
  setTabs([["steps", `Steps (${d.steps.length})`], ["entries", "Entries"],
           ["events", `Events (${d.events.length})`], ["describe", "Decoded"], ["raw", "Raw"]]);
  if (detailView === "steps") return renderSteps(d);
  if (detailView === "events") return renderFileEvents(d);
  if (detailView !== "entries") {
    $("#detail").innerHTML = `<pre>${esc(detailView === "raw" ? d.raw : d.describe)}</pre>`;
    return;
  }
  if (!d.batches.length) {
    const errs = d.event.errors || [];
    $("#detail").innerHTML = `<div class="empty">File could not be parsed.${errs.map((e) => `<div class="err">${esc(e)}</div>`).join("")}</div>`;
    return;
  }
  const settle = Object.fromEntries((d.event.batches_detail || []).map((b) => [b.batch, b]));
  $("#detail").innerHTML = `<div class="scroll">` + d.batches.map((b) => {
    const s = settle[b.batch];
    const when = s ? ` · settles ${esc(s.settlement_date)} (${esc(s.window)})` : "";
    const rows = b.entries.map((e) => {
      const outs = e.outcomes.length ? e.outcomes.map((o) => `<span class="pill ${o.kind}">${esc(o.text)}</span>`).join("")
        : (d.event.event === "file_rejected" ? `<span class="pill rejected">file rejected</span>` : "");
      return `<tr><td class="mono">${esc(e.trace)}</td>
        <td title="${esc(e.tx_desc)}">${esc(e.tx)}</td>
        <td>${esc(e.name)}<div class="ev-detail">${esc(e.rdfi)} · ${esc(e.account)}${e.addenda ? " · " + esc(e.addenda) : ""}</div></td>
        <td class="num">${e.credit ? "" : "−"}${money(e.amount_cents)}</td><td>${outs}</td></tr>`;
    }).join("");
    return `<div class="batch-h">Batch ${b.batch} · ${esc(b.sec)} · ${esc(b.company)}
      <span>${esc(b.description)} · effective ${esc(b.effective_date)}${when}</span></div>
      <table><thead><tr><th>Trace</th><th>Tx</th><th>Receiver</th><th style="text-align:right">Amount</th><th>Outcome</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }).join("") + `</div>`;
}

// ---------- step-by-step view ----------
function stepTitle(s) {
  const info = STEP_INFO[s.step] || [s.step, "", ""];
  let title = info[0], svc = info[1];
  if (s.step === "route" || s.step === "dispatch") title += ` · ${bankName(s.rdfi)}`;
  if (s.step === "dispatch") svc = "ach-rdfi-" + bankName(s.rdfi).toLowerCase().replace(/[^a-z0-9]+/g, "-");
  if (s.step.startsWith("mailbox_")) title += ` · ${bankName(s.bank)}`;
  return [title, svc, info[2]];
}
function stepSummary(s) {
  const parts = Object.entries(s).filter(([k, v]) => !STEP_KEYS.has(k) && !["rdfi", "bank"].includes(k) && v !== "" && v != null)
    .map(([k, v]) => `${k}=${Array.isArray(v) ? v.join(",") : v}`);
  return parts.join(" · ");
}

function renderSteps(d) {
  const steps = d.steps;
  const fileStatus = d.event.event === "file_accepted" ? "accepted" : d.event.event === "file_rejected" ? "rejected" : "";
  const tid = steps.find((s) => s.trace_id)?.trace_id || d.events.find((e) => e.trace_id)?.trace_id || "";
  const rel = [];
  for (const r of d.related.returns_files || []) rel.push(`returns came back as <span class="link" data-file="${esc(r)}">${esc(r)}</span>`);
  if (d.related.in_response_to) rel.push(`returns/NOCs for <span class="link" data-file="${esc(d.related.in_response_to)}">${esc(d.related.in_response_to)}</span>`);
  if (!steps.length) {
    $("#detail").innerHTML = `<div class="empty">No step records for this file: it was processed before step tracing was added.
      Its ${d.events.length} events are on the Events tab.</div>`;
    return;
  }
  stepIdx = Math.min(stepIdx, steps.length - 1);
  const maxDur = Math.max(...steps.map((s) => s.duration_ms || 0), 0.001);
  const total = steps.reduce((a, s) => a + (s.duration_ms || 0), 0);
  const items = steps.map((s, i) => {
    const [title, svc] = stepTitle(s);
    const cls = [s.status, i === stepIdx ? "sel" : "", i > stepIdx ? "future" : ""].join(" ");
    return `<li class="step ${cls}" data-i="${i}"><span class="num">${i + 1}</span>
      <div style="min-width:0"><div class="t" title="${esc(title)}">${esc(title)}</div>
        <div class="sub" title="${esc(stepSummary(s))}"><span class="svc">${esc(svc)}</span>${stepSummary(s) ? " · " + esc(stepSummary(s)) : ""}</div></div>
      <div class="dur"><div class="bar" style="width:${Math.max(2, 100 * (s.duration_ms || 0) / maxDur)}%"></div>${(s.duration_ms ?? 0).toFixed(1)} ms</div></li>`;
  }).join("");
  $("#detail").innerHTML = `
    <div class="steps-bar">
      ${fileStatus ? `<span class="pill ${fileStatus}">${fileStatus}</span>` : ""}
      ${tid ? `<span class="muted">trace <span class="mono copy" title="click to copy" data-copy="${esc(tid)}">${esc(tid)}</span></span>` : ""}
      ${rel.length ? `<span class="muted">· ${rel.join(" · ")}</span>` : ""}
      <span class="grow"></span>
      <span class="muted">${steps.length} steps · ${total.toFixed(1)} ms</span>
      <button class="btn" id="st-first" title="first step (Home)">⏮</button>
      <button class="btn" id="st-prev" title="previous step (←)">◀ Prev</button>
      <button class="btn" id="st-play">${playTimer ? "⏸ Pause" : "▶ Play"}</button>
      <button class="btn" id="st-next" title="next step (→)">Next ▶</button>
      <button class="btn" id="st-last" title="show all steps (End)">⏭ All</button>
      <span class="muted">step ${stepIdx + 1} / ${steps.length}</span>
    </div>
    <div class="steps-grid"><ol class="stepper">${items}</ol><div class="step-detail" id="step-detail"></div></div>`;
  renderStepDetail(steps[stepIdx], stepIdx);
  document.querySelectorAll(".step").forEach((el) => el.onclick = () => { stopPlay(); goStep(+el.dataset.i); });
  $("#st-first").onclick = () => { stopPlay(); goStep(0); };
  $("#st-prev").onclick = () => { stopPlay(); goStep(stepIdx - 1); };
  $("#st-next").onclick = () => { stopPlay(); goStep(stepIdx + 1); };
  $("#st-last").onclick = () => { stopPlay(); goStep(steps.length - 1); };
  $("#st-play").onclick = () => playTimer ? stopPlay() : startPlay();
  wireCommon($("#detail"));
}

function renderStepDetail(s, i) {
  const [title, svc, desc] = stepTitle(s);
  const detail = Object.entries(s).filter(([k, v]) => !STEP_KEYS.has(k) && v !== "" && v != null);
  const span = SPAN_NAME[s.step] || `ach.step.${s.step}`;
  const tid = s.trace_id || "", sid = s.span_id || "";
  const dqlSpans = `fetch spans | filter toString(trace.id) == "${tid}" | sort start_time asc`;
  const dqlLogs = `fetch logs | filter toString(trace_id) == "${tid}" | sort timestamp asc`;
  const evs = s.events || [];
  $("#step-detail").innerHTML = `
    <h3>${i + 1}. ${esc(title)} <span class="pill ${statusPill(s.status)}">${esc(s.status)}</span>
      <span class="muted">${(s.duration_ms ?? 0).toFixed(3)} ms · ${esc(svc)}</span></h3>
    <div class="desc">${esc(desc)}</div>
    ${detail.length ? `<div class="kv">${detail.map(([k, v]) => `<div>${esc(k)}</div><div>${
      k === "returns_file" ? `<span class="link" data-file="${esc(v)}">${esc(v)}</span>` : esc(Array.isArray(v) ? v.join(", ") : typeof v === "object" ? JSON.stringify(v) : v)}</div>`).join("")}</div>` : ""}
    <div class="tele">
      <div class="h">Telemetry captured for this step</div>
      <div class="row"><b>Trace</b><div>span <code>${esc(span)}</code> · span id <code class="copy" data-copy="${esc(sid)}">${esc(sid) || "–"}</code>
        · trace <code class="copy" data-copy="${esc(tid)}">${esc(tid.slice(0, 16)) || "–"}${tid ? "…" : ""}</code>
        ${s.status === "error" ? ' · <span class="pill error">span status ERROR</span>' : ""}</div></div>
      <div class="row"><b>Metrics</b><div><code>ach.steps</code> +1 and <code>ach.step.duration</code> ${(s.duration_ms ?? 0).toFixed(3)} ms
        with <code>ach.step="${esc(s.step)}"</code>, <code>ach.step.status="${esc(s.status)}"</code></div></div>
      <div class="row"><b>Log</b><div><code>file_step</code> record from <code>ach_sim.operator</code> at
        ${s.status === "error" ? "ERROR" : s.status === "rejected" ? "WARNING" : "INFO"}, carrying this trace and span id
        ${evs.length ? ` (+${evs.length} more log record${evs.length > 1 ? "s" : ""} for the events below)` : ""}</div></div>
      ${tid ? `<div class="row"><b>DQL</b><div><span class="link" data-copy="${esc(dqlSpans)}">copy spans query</span> ·
        <span class="link" data-copy="${esc(dqlLogs)}">copy logs query</span></div></div>` : ""}
    </div>
    <div><div class="sec-h">Events recorded in this step (${evs.length + 1})</div>
      ${eventTable([s, ...evs], false)}</div>`;
  wireCommon($("#step-detail"));
}

function goStep(i) {
  const steps = detail?.data?.steps || [];
  if (!steps.length) return;
  stepIdx = Math.max(0, Math.min(steps.length - 1, i));
  history.replaceState(null, "", `#file=${encodeURIComponent(detail.data.file_id)}&step=${stepIdx + 1}`);
  renderSteps(detail.data);
}
function startPlay() {
  const steps = detail?.data?.steps || [];
  if (!steps.length) return;
  if (stepIdx >= steps.length - 1) stepIdx = -1;
  playTimer = setInterval(() => {
    if (stepIdx >= steps.length - 1) return stopPlay();
    goStep(stepIdx + 1);
  }, 1100);
  goStep(stepIdx + 1);
}
function stopPlay() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
  const b = $("#st-play"); if (b) b.textContent = "▶ Play";
}

function renderFileEvents(d) {
  const stepBySpan = Object.fromEntries(d.steps.map((s) => [s.span_id, s.step]));
  $("#detail").innerHTML = d.events.length
    ? `<div class="scroll">${eventTable(d.events, true, stepBySpan)}</div>`
    : `<div class="empty">No events for this file.</div>`;
  wireCommon($("#detail"));
}

// ---------- events (shared by the file view and the event log) ----------
function evKind(e) {
  if (e.event === "file_step") return statusPill(e.status);
  if (e.event === "file_rejected" || e.event === "operator_return" || e.event === "rdfi_unavailable") return "return";
  if (e.event === "file_accepted") return "post";
  if (e.event === "rdfi_decision") return e.outcome.startsWith("posted") ? "post" : e.outcome.startsWith("NOC") ? "noc" : "return";
  return "info";
}
function evKey(e) { return `${e.ts}|${e.event}|${e.span_id || ""}|${e.trace || e.step || e.mailbox_file || ""}|${e.file_id || ""}`; }
function eventTable(evs, withStep, stepBySpan = {}) {
  const head = `<tr><th>UTC</th>${withStep ? "<th>Step</th>" : ""}<th>Event</th><th>Details</th></tr>`;
  const cols = withStep ? 4 : 3;
  return `<table><thead>${head}</thead><tbody>` + evs.map((e) => {
    const k = evKey(e), open = openEvents.has(k);
    const label = e.event === "file_step" ? `step: ${e.step}` : e.event;
    return `<tr class="ev" data-k="${esc(k)}"><td class="mono ts" title="${esc(e.ts)}">${esc(e.ts.slice(11, 19))}</td>
      ${withStep ? `<td class="mono">${esc(e.event === "file_step" ? e.step : stepBySpan[e.span_id] || "")}</td>` : ""}
      <td><span class="pill ${evKind(e)}" title="${e.trace_id ? "trace " + esc(e.trace_id) : ""}">${esc(label)}</span></td>
      <td class="ev-detail mono">${esc(eventSummary(e))}</td></tr>` +
      (open ? `<tr class="json"><td colspan="${cols}"><pre>${esc(JSON.stringify(e, null, 2))}</pre></td></tr>` : "");
  }).join("") + `</tbody></table>`;
}
function wireCommon(root) {
  root.querySelectorAll("tr.ev").forEach((tr) => tr.onclick = () => {
    const k = tr.dataset.k;
    openEvents.has(k) ? openEvents.delete(k) : openEvents.add(k);
    const next = tr.nextElementSibling;
    if (next?.classList.contains("json")) next.remove();
    else {
      const row = document.createElement("tr"); row.className = "json";
      const ev = findEvent(k);
      row.innerHTML = `<td colspan="${tr.children.length}"><pre>${esc(JSON.stringify(ev, null, 2))}</pre></td>`;
      tr.after(row);
    }
  });
  root.querySelectorAll("[data-copy]").forEach((el) => el.onclick = (ev) => {
    ev.stopPropagation(); copy(el.dataset.copy);
    const old = el.textContent; el.textContent = "copied"; setTimeout(() => el.textContent = old, 900);
  });
  root.querySelectorAll("[data-file]").forEach((el) => el.onclick = (ev) => { ev.stopPropagation(); selectFile(el.dataset.file); });
}
function findEvent(k) {
  const pools = [detail?.data?.events || [], ...(detail?.data?.steps || []).map((s) => [s, ...(s.events || [])]), state?.events || []];
  for (const pool of pools) for (const e of pool) if (evKey(e) === k) {
    const {events, ...rest} = e; return rest;
  }
  return {};
}

function eventSummary(ev) {
  const skip = new Set(["ts", "event", "batches_detail", "traces", "items", "errors", "warnings", "trace_id", "span_id", "events"]);
  const parts = Object.entries(ev).filter(([k, v]) => !skip.has(k) && v !== "" && v != null)
    .map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`);
  if (ev.traces) parts.push(`${ev.traces.length} entries`);
  if (ev.items) parts.push(ev.items.map((i) => `${i.code}←${i.original_trace}`).join(", "));
  if (ev.errors?.length) parts.push(ev.errors.join("; "));
  return parts.join("  ");
}

function renderBottom() {
  $("#tab-events").classList.toggle("on", bottomTab === "events");
  $("#tab-mail").classList.toggle("on", bottomTab === "mail");
  $("#ev-filter").style.display = bottomTab === "events" ? "" : "none";
  $("#ev-only-l").style.display = bottomTab === "events" ? "" : "none";
  if (bottomTab === "events") {
    const sel = $("#ev-filter"), cur = sel.value;
    const kinds = [...new Set(state.events.map((e) => e.event))].sort();
    sel.innerHTML = `<option value="">all events</option>` + kinds.map((k) => `<option ${k === cur ? "selected" : ""}>${esc(k)}</option>`).join("");
    const only = $("#ev-only").checked && selected?.type === "file" && detail?.type === "file";
    const pool = only ? [...detail.data.events].reverse() : state.events;
    const evs = pool.filter((e) => !cur || e.event === cur);
    $("#bottom").innerHTML = evs.length ? `<div class="scroll">${eventTable(evs, false)}</div>`
      : `<div class="empty">No events${only ? " for this file" : ""} yet.</div>`;
    wireCommon($("#bottom"));
  } else {
    $("#bottom").innerHTML = `<div class="boxes">` + state.mailboxes.map((m) => {
      const li = (n, picked) => `<li class="${picked ? "done" : ""}" data-rt="${m.routing}" data-n="${esc(n)}" data-p="${picked ? 1 : ""}">${esc(n)}</li>`;
      return `<div class="box"><h3>${esc(m.name)} <span>${m.routing} · ${m.mode === "auto" ? "simulated RDFI" : "pulls its own mailbox"}</span></h3>
        <div class="lbl">Waiting (${m.waiting.length})</div><ul>${m.waiting.map((n) => li(n, false)).join("") || "<li class='done'>empty</li>"}</ul>
        <div class="lbl">Picked up (${m.picked_up.length})</div><ul>${m.picked_up.map((n) => li(n, true)).join("") || "<li class='done'>none</li>"}</ul></div>`;
    }).join("") + `</div>`;
    document.querySelectorAll(".box li[data-n]").forEach((el) =>
      el.onclick = () => loadMailbox(el.dataset.rt, el.dataset.n, !!el.dataset.p));
  }
}

$("#tab-events").onclick = () => { bottomTab = "events"; renderBottom(); };
$("#tab-mail").onclick = () => { bottomTab = "mail"; renderBottom(); };
$("#ev-filter").onchange = renderBottom;
$("#ev-only").onchange = renderBottom;
document.addEventListener("keydown", (e) => {
  if (detailView !== "steps" || detail?.type !== "file" || e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  const map = {ArrowLeft: () => goStep(stepIdx - 1), ArrowRight: () => goStep(stepIdx + 1),
               Home: () => goStep(0), End: () => goStep(1e9)};
  if (map[e.key]) { e.preventDefault(); stopPlay(); map[e.key](); }
});
// Deep link: #file=F20261102-0001&step=3 opens that file at that step.
const hash = new URLSearchParams(location.hash.slice(1));
refresh().then(() => {
  if (hash.get("file")) { selectFile(hash.get("file")); stepIdx = Math.max(0, (+hash.get("step") || 1) - 1); }
});
setInterval(() => { if ($("#live").checked) refresh(); }, 2000);
</script>
</body>
</html>
